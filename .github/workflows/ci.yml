name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
  schedule:
    - cron: '0 7 * * *'   # nightly — full CI (unit suites + the otherwise-gated e2e job)

jobs:
  web:
    name: Web (Next.js / Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # Guard: the worker's test schema.sql must not drift from prisma/schema.prisma.
      - run: node ../../tools/check_schema_drift.mjs
      # Guard: no private file (.env / resume / db / config.yaml) may be tracked.
      - run: node ../../tools/check_privacy.mjs --self-test && node ../../tools/check_privacy.mjs
      - run: npm run lint
      # Unit + integration with the merged coverage gate (jest.all.config.ts).
      - run: npm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: ignore

  worker:
    name: Worker (Python / pytest)
    runs-on: ubuntu-latest
    # Runs on the nightly cron too, to catch unpinned requirements-dev.txt drift early.
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Fully dependency-injected suite — requirements-dev.txt is test-only
      # (pytest, pytest-cov, requests, beautifulsoup4, PyYAML, pycountry); none of
      # the heavy runtime deps (anthropic / apscheduler) are needed or installed.
      - run: pip install -r requirements-dev.txt
      # Coverage floor (fail_under=85) lives in pyproject [tool.coverage.report] so
      # local and CI enforce the same threshold from one place — no --cov-fail-under here.
      - run: python -m pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: worker-coverage
          path: apps/worker/coverage.xml
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Heavy (browser install + web build): only on master, nightly, or PRs labeled 'e2e'.
    if: >
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
