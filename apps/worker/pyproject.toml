[project]
name = "ats-worker"
version = "1.0.0"
description = "Semi-automated job-hunt pipeline worker for Job Matchbook"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "integration: full run_once end-to-end over a temp SQLite (deselect with -m 'not integration')",
]

[tool.coverage.run]
source = ["ats_worker"]
branch = true

[tool.coverage.report]
# Single source of truth for the coverage floor: both `make test-coverage` and CI
# read it (CI does NOT pass --cov-fail-under), so the gate is identical and the
# ratchet lives in one place. Bump as coverage grows. (run.main()/cron + the lazy
# real-adapter bodies are legitimately uncovered by the hermetic suite.) 84, not 85:
# removing the near-fully-covered fit scorer took ~1 point off the total; the
# uncovered remainder is mostly preselection/shadow.py and mcp/server.py (JEV).
fail_under = 84
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
include = ["ats_worker*"]
