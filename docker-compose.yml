services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Match the host user that owns ./db so bind-mount writes
        # work without chmod 777.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ats-web:local
    container_name: ats-web
    ports:
      # Loopback by DEFAULT — single-user localhost, no auth layer (a non-goal).
      # Publishing on 0.0.0.0 exposes the 26 unauthenticated server actions to any LAN
      # peer, so the default never changes on its own. See docs/SPEC.md §6 / §11.
      #
      # WEB_BIND overrides the bind ADDRESS only (never the port) for the one case that
      # needs it: reaching the dashboard from another of your own machines over a
      # private WireGuard mesh (Tailscale/WireGuard), where the mesh interface is
      # already authenticated at the network layer. Set it in the gitignored root
      # `.env` — e.g. WEB_BIND=100.x.y.z — NOT to 0.0.0.0, which would also publish on
      # the LAN. Every unauthenticated action is reachable by any device on that mesh,
      # so only point it at a mesh whose nodes are all yours.
      #
      # It must be an address on whatever host DOCKER publishes to, which is not always
      # the shell you type in: under Docker Desktop the CLI runs in WSL but ports are
      # published on WINDOWS, so the right value is the Windows node's mesh IP, not the
      # WSL node's. `docker info` naming "Docker Desktop" means you are in that case.
      - "${WEB_BIND:-127.0.0.1}:3000:3000"
    environment:
      # Absolute path on the DIRECTORY-mounted shared volume. A directory mount
      # (not a single-file mount) is REQUIRED so SQLite's WAL -wal/-shm sidecars
      # created by the worker are visible here — otherwise cross-container WAL
      # silently breaks and reads/writes can diverge.
      DATABASE_URL: "file:/data/applications.db"
    volumes:
      - ./db:/data            # shared SQLite directory (db + WAL sidecars)
    restart: unless-stopped
    # Probe DB reachability, NOT just the HTTP port: the WSL2 stale-bind-mount
    # failure leaves the server up but Prisma unable to open /data/applications.db
    # (SQLITE_CANTOPEN). On repeated failures the container is marked unhealthy and
    # the autoheal sidecar restarts it (which re-establishes the mount). See SPEC §6.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - autoheal=true # watched by the autoheal sidecar below

  # Watches for containers labeled autoheal=true and restarts any that Docker marks
  # "unhealthy". Needs the Docker socket to issue the restart; local-only, no network
  # exposure. This is what actually recovers ats-web from a stale bind mount.
  #
  # NOTHING IN COMPOSE ACTS ON `unhealthy`. `restart:` fires on container EXIT only, and
  # `depends_on: service_healthy` is a startup gate (and would be actively harmful here —
  # it would hold the sidecar down whenever web is the thing that needs healing). That is
  # why this sidecar exists at all, and why the healthcheck below cannot by itself recover
  # a broken sidecar: a healthcheck reports, the entrypoint watchdog is what acts.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: ats-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal # restart only containers labeled autoheal=true
      AUTOHEAL_INTERVAL: 10              # poll health every 10s
      AUTOHEAL_START_PERIOD: 30          # grace before first check
      CURL_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    # Exit when the socket dies, so `restart: unless-stopped` recreates us and the START
    # re-resolves the bind mount. A bind mount is resolved at every container START (not
    # at creation), so a restart is the only thing that can pick up a docker.sock the
    # daemon replaced under us — which is what killed this sidecar on 2026-07-23.
    #
    # The image's entrypoint dispatches on `[ "$$1" = "autoheal" ] && [ -e "$$DOCKER_SOCK" ]`
    # and there is no `autoheal` BINARY in the image (the loop is inline in
    # /docker-entrypoint), so a missing socket already exits 127 — but only at startup.
    # This covers the socket dying while we are up, which is the case that used to leave a
    # live sidecar doing nothing forever.
    #
    # This wrapper is correct ONLY together with the healthcheck below: the wrapper shell
    # has "autoheal" in its own argv, so the image's default `pgrep -f autoheal` check
    # would call it healthy no matter what. Drilled 2026-07-28 against a throwaway
    # container with a bogus socket path: exit 1, restarted 7x in 8s; and with a real
    # socket: still running, RestartCount 0, healthy.
    entrypoint:
      - /bin/sh
      - -c
      - |
        /docker-entrypoint autoheal & child=$$!
        while curl -fsS --max-time 5 --unix-socket "$$DOCKER_SOCK" http://localhost/_ping >/dev/null 2>&1; do
          sleep "$${WATCHDOG_INTERVAL:-30}"
        done
        echo "[watchdog] docker socket unreachable at $$DOCKER_SOCK - exiting so the restart policy re-resolves the bind mount" >&2
        kill "$$child" 2>/dev/null || true
        exit 1
    # Replaces the image's `pgrep -f autoheal`, which reports healthy for a sidecar that
    # is doing nothing: `Cmd=["autoheal"]` puts that string in its own argv, so the check
    # matches itself. A sidecar whose socket died reads `Up (healthy)` forever under it.
    # Drilled 2026-07-28 in one container with a dead socket: this check said `unhealthy`,
    # `pgrep -f autoheal` said healthy.
    #
    # CMD-SHELL is mandatory — the exec form does not expand variables. The path is
    # HARDCODED rather than `$$DOCKER_SOCK` so the check and the volume above cannot
    # disagree about which socket is being tested.
    #
    # All four timing fields are set: an omitted one takes the DAEMON default, not the
    # image's, so inheriting three of them from a 5s-interval image is not what happens.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 --unix-socket /var/run/docker.sock http://localhost/_ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# NO worker service — the worker runs NATIVELY on the host (see docs/SPEC.md §6).
# It was containerized until 2026-07-16; removed because the fit scorer now shells out
# to the Codex CLI, which authenticates from the operator's ~/.codex/auth.json `codex
# login` state. Containerizing that means baking a 285 MB binary into the image AND
# mounting a live subscription token into it — for a service that was already pinned to
# the host by Ollama's GPU. Run it with `python -m ats_worker.run` (see SPEC §7.1).
