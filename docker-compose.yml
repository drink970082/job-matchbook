services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # Match the host user that owns ./db so bind-mount writes
        # work without chmod 777.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ats-web:local
    container_name: ats-web
    ports:
      - "3000:3000"
    environment:
      # Absolute path on the DIRECTORY-mounted shared volume. A directory mount
      # (not a single-file mount) is REQUIRED so SQLite's WAL -wal/-shm sidecars
      # created by the worker are visible here — otherwise cross-container WAL
      # silently breaks and reads/writes can diverge.
      DATABASE_URL: "file:/data/applications.db"
    volumes:
      - ./db:/data            # shared SQLite directory (db + WAL sidecars)
    restart: unless-stopped
    # Probe DB reachability, NOT just the HTTP port: the WSL2 stale-bind-mount
    # failure leaves the server up but Prisma unable to open /data/applications.db
    # (SQLITE_CANTOPEN). On repeated failures the container is marked unhealthy and
    # the autoheal sidecar restarts it (which re-establishes the mount). See SPEC §6.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - autoheal=true # watched by the autoheal sidecar below

  # Watches for containers labeled autoheal=true and restarts any that Docker
  # marks "unhealthy" (plain Compose does NOT auto-restart on unhealthy by
  # itself). Needs the Docker socket to issue the restart; local-only, no network
  # exposure. This is what actually recovers ats-web from a stale bind mount.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: ats-autoheal
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal # restart only containers labeled autoheal=true
      AUTOHEAL_INTERVAL: 10              # poll health every 10s
      AUTOHEAL_START_PERIOD: 30          # grace before first check
      CURL_TIMEOUT: 30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: ats-worker:local
    container_name: ats-worker
    environment:
      # Read via os.environ by run.py's argparse defaults.
      DB_PATH: "/data/applications.db"
    extra_hosts:
      # Required on Linux/Compose for the worker to reach Ollama running on the
      # HOST (which owns the GPU). On Docker Desktop this is implicit, but being
      # explicit makes it work everywhere. The .env's OLLAMA_HOST should be
      # http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./db:/data                               # SAME shared db directory (co-write)
      - ./apps/worker/config.yaml:/app/config.yaml:ro
      - ./apps/worker/.env:/app/.env:ro          # secrets + OLLAMA_HOST
      - ./apps/worker/resume:/app/resume:ro      # resume.txt (fed to the scorer)
    depends_on:
      - web
    restart: unless-stopped
